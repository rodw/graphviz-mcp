name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Lint, types, unit tests, licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -e '.[dev]' -c requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/check_licenses.py
      - run: python scripts/gen_tool_docs.py --check
      - run: python scripts/gen_notices.py --check
      - run: python scripts/check_release_version.py
      - run: pytest

  dockerfile-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: make audit.docker.dockerfile

  docker-image:
    name: Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Read the project version
        id: version
        run: echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: graphviz-mcp:ci
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -e '.[dev]' -c requirements.lock
      - name: Docker image tests (contract, tools, golden SVG, security, concurrency, policy modes)
        run: GVMCP_TEST_DOCKER_IMAGE=graphviz-mcp:ci pytest -m docker_image
      - name: Docker image audit (trivy scan, image size)
        run: make audit.docker.image-run AUDIT_IMAGE=graphviz-mcp:ci
      - name: Smoke test (hardened flags, no network)
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          # Capture the output first: `grep -q` exiting early would SIGPIPE docker under pipefail.
          response="$(printf '%s\n' "$request" \
            | docker run -i --rm --network=none --read-only --tmpfs /tmp --cap-drop=ALL graphviz-mcp:ci --stdio 2>/dev/null)"
          grep -q '"graphviz-mcp"' <<< "$response"
      # Report only: the tests above are the gate. This runs the same tests again against a coverage-instrumented variant
      # of the image just built (Dockerfile.test-coverage) to show which lines of src/ they exercise inside the containers.
      - name: Docker image tests with coverage (report only)
        if: matrix.arch == 'amd64'
        continue-on-error: true
        run: |
          docker build --build-arg BASE=graphviz-mcp:ci \
            --build-arg COVERAGE_VERSION="$(python -c 'import coverage; print(coverage.__version__)')" \
            -t graphviz-mcp:ci-coverage - < Dockerfile.test-coverage
          make test-coverage.docker-image-run COVERAGE_IMAGE=graphviz-mcp:ci-coverage VENV_PYTEST_EXE=pytest VENV_PYTHON_EXE=python
      - name: Coverage summary
        if: matrix.arch == 'amd64' && always()
        run: |
          if [ -f .coverage-docker/.coverage ]; then
            echo '### Docker image test coverage (line coverage of src/graphviz_mcp, report only)' >> "$GITHUB_STEP_SUMMARY"
            COVERAGE_FILE=.coverage-docker/.coverage python -m coverage report --skip-empty --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: matrix.arch == 'amd64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-coverage
          path: .coverage-docker/html
          if-no-files-found: ignore
