# Short descriptions of each graphviz attribute; combined with the (generated) attribute-list.toml for the attribute reference

[description]
_background = "Drawing operations in xdot format painted behind the graph (gvmap uses it for its map colors)."
area = "Preferred relative area of a node or cluster in patchwork layouts."
arrowhead = "Shape of the arrow at the head end of an edge (normal, dot, odot, none, vee, ...)."
arrowsize = "Multiplier for the size of arrowheads."
arrowtail = "Shape of the arrow at the tail end of an edge (used when dir is back or both)."
bb = "Output only."
beautify = "In sfdp, arrange leaf nodes in a circle around their parent."
bgcolor = "Background color of the drawing or of a cluster."
center = "Center the drawing on the page."
charset = "Character encoding of the input text."
class = "Space-separated style class names written into SVG output, for use with stylesheets."
cluster = "Treat the subgraph as a cluster even though its name does not start with 'cluster'."
clusterrank = "How clusters are handled by dot: local, global or none."
color = "Outline color of nodes and clusters, line color of edges; a color list draws parallel or striped lines."
colorscheme = "Color scheme that names such as 1-9 refer to (for example blues9, set312)."
comment = "Text inserted into the output as a comment."
compound = "Allow edges between clusters through lhead and ltail."
concentrate = "Merge parallel edge paths where they share a route."
constraint = "Whether the edge influences rank assignment in dot."
Damping = "Factor limiting each node's movement per iteration in neato; values below 1 make the layout settle."
decorate = "Draw a line connecting an edge's label to the edge."
defaultdist = "Distance neato assumes between nodes in different connected components."
dim = "Number of dimensions in which neato, fdp and sfdp compute the layout (default 2)."
dimen = "Number of dimensions used when rendering the layout; defaults to dim."
dir = "Which ends of an edge get arrowheads: forward, back, both or none."
diredgeconstraints = "In neato, keep directed edges pointing the same way; true or hier, used with mode=ipsep or hier."
distortion = "Distortion of polygon shapes; positive widens the top."
dpi = "Resolution in dots per inch; scales raster output size."
edgehref = "Link for the non-label parts of an edge in SVG, PDF and image-map outputs; overrides href."
edgetarget = "Browsing context for the edge's link (for example _blank); overrides target."
edgetooltip = "Tooltip for the non-label parts of an edge."
edgeURL = "Link for the non-label parts of an edge; overrides URL."
epsilon = "Convergence threshold of neato's solver."
esep = "Margin around nodes that edge routing keeps clear (neato)."
fillcolor = "Fill color used with style=filled or style=radial."
fixedsize = "Keep the node at its width and height instead of growing to fit the label; 'shape' fixes only the shape."
fontcolor = "Color of label text."
fontname = "Font family used for label text."
fontnames = "How font names are written in SVG output: svg, ps or native."
fontpath = "Directories Graphviz searches for font files."
fontsize = "Font size in points."
forcelabels = "Place xlabels even when they overlap other objects."
gradientangle = "Angle of gradient fills, in degrees."
group = "Nodes in the same group are kept on a straight line where possible (dot)."
head_lp = "Output only."
headclip = "Clip the edge at the boundary of the head node."
headhref = "Link for the head end of an edge in SVG, PDF and image-map outputs."
headlabel = "Label placed near the head end of an edge."
headport = "Where on the head node the edge attaches (record field, or compass point such as n, se)."
headtarget = "Browsing context for the head end's link."
headtooltip = "Tooltip for the head end of an edge."
headURL = "Link for the head end of an edge; same as headhref."
height = "Minimum node height in inches."
href = "Link target for SVG, PDF and image-map outputs (same as URL)."
id = "Identifier written into SVG output for the object."
image = "Reads an image file from the server."
imagepath = "Search path for image files on the server."
imagepos = "Where an image sits inside its node: tl, tc, tr, ml, mc, mr, bl, bc or br."
imagescale = "How an image is scaled to its node: false, true, width, height or both."
inputscale = "Scale factor for input positions in neato -n mode."
K = "Spring constant of fdp and sfdp; larger values spread the layout."
label = "Text label; may be plain text with escapes (\\n, \\l, \\r, \\N, \\G) or an HTML-like string in angle brackets."
label_scheme = "In sfdp, how edge labels take part in the layout; 0 ignores them, larger values add extra nodes for labels."
labelangle = "Angle in degrees between the edge and its head or tail label."
labeldistance = "Distance multiplier for head and tail labels."
labelfloat = "Let edge labels be placed with fewer constraints; they may overlap other edges."
labelfontcolor = "Font color of an edge's head and tail labels."
labelfontname = "Font of an edge's head and tail labels."
labelfontsize = "Font size in points of an edge's head and tail labels."
labelhref = "Link for an edge's label in SVG, PDF and image-map outputs."
labeljust = "Horizontal justification of a graph or cluster label: l, r or c."
labelloc = "Vertical placement of a label: t, c or b."
labeltarget = "Browsing context for the label's link."
labeltooltip = "Tooltip for an edge's label."
labelURL = "Link for an edge's label; same as labelhref."
landscape = "Rotate the drawing 90 degrees (same as rotate=90)."
layer = "Layer(s) the object belongs to."
layerlistsep = "Separator between layer ranges in lists of layers (default comma)."
layers = "Names of the layers, separated by layersep."
layerselect = "Layers to draw, as names or ranges such as a:c; others are omitted from the output."
layersep = "Separator characters between layer names in layers (default colon, tab and space)."
layout = "Layout engine to use, by name; overrides the tool's engine."
len = "Preferred edge length in neato and fdp."
levels = "Number of levels in sfdp's multilevel scheme."
levelsgap = "In neato's hier and ipsep modes, the minimum gap between levels; negative values let levels overlap."
lhead = "Clip the edge at the named cluster at its head end (needs compound=true)."
lheight = "Output only."
linelength = "Line width at which DOT output is wrapped when long strings are written."
lp = "Output only."
ltail = "Clip the edge at the named cluster at its tail end (needs compound=true)."
lwidth = "Output only."
margin = "Space around the label (nodes, clusters) or around the drawing (graph)."
maxiter = "Maximum iterations of iterative layouts."
mclimit = "Scale factor for crossing-minimization effort in dot."
mindist = "Minimum separation between all nodes in circo."
minlen = "Minimum number of ranks the edge spans in dot."
mode = "Optimization mode of neato: major, KK, sgd, hier or ipsep."
model = "Distance model of neato: shortpath, circuit or subset."
newrank = "Use the single global ranking pass of dot, which allows rank=same across clusters."
nodesep = "Minimum space between adjacent nodes in the same rank, in inches."
nojustify = "Justify multi-line labels relative to the label itself, not the enclosing object."
normalize = "Normalize the final layout (neato)."
notranslate = "In neato, do not shift the final layout so its lower-left corner is at the origin."
nslimit = "Scale factor for network-simplex iterations when ranking in dot."
nslimit1 = "Same as nslimit, for x-coordinate assignment."
oneblock = "In circo, lay out each connected component as one circle instead of splitting it into blocks."
ordering = "Constrain the left-to-right order of outgoing (out) or incoming (in) edges in dot."
orientation = "Rotation of a node shape in degrees; on the graph, 'land' rotates the drawing."
outputorder = "Order in which nodes and edges are emitted: breadthfirst, nodesfirst or edgesfirst."
overlap = "How to treat node overlap in neato-like layouts: false, scale, prism, voronoi, ..."
overlap_scaling = "Scaling applied by the prism overlap-removal algorithm."
overlap_shrink = "Run a compression pass after overlap removal to reduce the layout's size."
pack = "Lay out connected components separately and pack them; the number is the margin."
packmode = "Granularity of packing: node, clust, graph, optionally array_...."
pad = "Margin added around the drawing, in inches."
page = "Page size for paginated output such as PostScript."
pagedir = "Order in which pages are emitted."
pencolor = "Color of a cluster's border."
penwidth = "Width of lines and borders in points."
peripheries = "Number of concentric outlines."
pin = "Keep the node at its pos instead of moving it (neato and fdp)."
pos = "Position of a node or the route of an edge; written by layout, read by neato -n."
quadtree = "Barnes-Hut approximation used by sfdp: normal, fast or none."
quantum = "Round node label sizes up to a multiple of this value."
radius = "Radius of the rounded corners on orthogonal edges (splines=ortho)."
rank = "In dot, same, min, source, max or sink forces the nodes of the subgraph onto one rank."
rankdir = "Direction of rank progression in dot: TB, BT, LR or RL."
ranksep = "Separation between ranks in inches; 'equally' makes them even."
ratio = "Aspect ratio of the drawing: a number, fill, compress, expand or auto."
rects = "Output only."
regular = "Force polygon shapes to be regular (equal width and height)."
remincross = "Run a final crossing-minimization pass on clustered graphs."
repulsiveforce = "Strength of repulsion in sfdp."
resolution = "Synonym for dpi."
root = "Node used as the center in circo and twopi layouts."
rotate = "Rotate the drawing; 90 gives landscape."
rotation = "Angle in degrees by which sfdp rotates the final layout counterclockwise."
samehead = "Edges with the same samehead value attach at the same point on the head node (dot)."
sametail = "Edges with the same sametail value attach at the same point on the tail node (dot)."
samplepoints = "Points used to approximate shapes."
scale = "Scale factor (or x,y pair) neato and twopi apply to the layout after positioning nodes."
searchsize = "Maximum edges examined when looking for a network-simplex entering edge."
sep = "Margin around nodes that overlap removal keeps clear (neato)."
shape = "Node shape: ellipse, box, circle, record, plaintext, polygon, ..."
shapefile = "Reads a custom shape file from the server."
showboxes = "Debugging aid in dot: 1 or 2 prints guide boxes in PostScript output."
sides = "Number of sides when shape=polygon."
size = "Maximum drawing size in inches; a trailing ! also scales small drawings up."
skew = "Skew of polygon shapes; positive moves the top to the right."
smoothing = "Post-processing smoothing of sfdp layouts."
sortv = "Sort order of components or clusters when packing."
splines = "How edges are drawn: true/spline, line/false, polyline, ortho, curved or none/empty."
start = "Initial placement and random seed of neato and fdp (for example 'random', 'self', or a number)."
style = "Drawing style: filled, rounded, dashed, dotted, bold, invis, radial, striped, wedged, ..."
stylesheet = "Path or URL of a CSS stylesheet referenced from SVG output."
tail_lp = "Output only."
tailclip = "Clip the edge at the boundary of the tail node."
tailhref = "Link for the tail end of an edge in SVG, PDF and image-map outputs."
taillabel = "Label placed near the tail end of an edge."
tailport = "Where on the tail node the edge attaches (record field, or compass point such as n, se)."
tailtarget = "Browsing context for the tail end's link."
tailtooltip = "Tooltip for the tail end of an edge."
tailURL = "Link for the tail end of an edge; same as tailhref."
target = "Browsing context for links (for example _blank)."
TBbalance = "In dot, move nodes that could sit on several ranks to the top (min) or bottom (max) rank."
tooltip = "Tooltip text for SVG and image-map outputs."
truecolor = "Whether bitmap outputs use truecolor or a palette."
URL = "Link target for SVG, PDF and image-map outputs."
vertices = "Output only."
viewport = "Clipping window on the final drawing: W,H,Z,x,y."
voro_margin = "Margin, as a fraction of node size, that the voronoi overlap-removal method keeps around nodes."
weight = "Importance of keeping the edge short and straight; larger is stronger."
width = "Minimum node width in inches."
xdotversion = "Version of the xdot drawing format used in xdot output (for example 1.7)."
xlabel = "External label placed outside the node or edge without affecting layout."
xlp = "Output only."
z = "Z coordinate of a node, used by 3D outputs such as VRML."
