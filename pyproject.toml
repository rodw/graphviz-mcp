[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graphviz-mcp"
version = "0.1.0"
description = "An MCP service for the full Graphviz tool suite"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [ { name = "Rodney Waldhoff" }, { name = "graphviz-mcp contributors" } ]
dependencies = [
  "mcp>=2.3,<3",
  "jinja2>=3.1,<4",
  "markdown-it-py>=3,<5",
  "starlette>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-licenses>=5",
]

[project.urls]
Homepage = "https://github.com/rodw/graphviz-mcp"
Repository = "https://github.com/rodw/graphviz-mcp"
Issues = "https://github.com/rodw/graphviz-mcp/issues"
Documentation = "https://github.com/rodw/graphviz-mcp#readme"

[project.scripts]
graphviz-mcp = "graphviz_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphviz_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scratch", ".scratch", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S603", "RUF012", "ASYNC109", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501", "B007", "ASYNC221", "ASYNC110"]
"scripts/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false  # the SDK's custom_route / resource decorators are untyped

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "docker_image: runs against the built Docker image",
  "slow: slow test",
]
addopts = "-ra -m 'not docker_image'"

[tool.coverage.paths]
# the Docker image installs the package (non-editable) under site-packages; map it back onto the repo's sources
source = ["src/graphviz_mcp", "*/site-packages/graphviz_mcp"]
